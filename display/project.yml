name: CocoDisplay
options:
  bundleIdPrefix: com.stormkiln
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CocoKit:
    path: CocoKit
targets:
  CocoDisplay:
    type: application
    platform: iOS
    sources: [App]
    # Generated by XcodeGen (gitignored) and merged with GENERATE_INFOPLIST_FILE keys. Array and
    # dictionary keys can't be expressed as INFOPLIST_KEY_* build settings, so they live here.
    info:
      path: Info.plist
      properties:
        # XcodeGen's template hardcodes 1.0 / 1; keep the build settings authoritative.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_coco._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: CocoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stormkiln.heycoco.display
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Coco Display finds and talks to Coco Hub on your home network."
        CODE_SIGNING_ALLOWED: NO
schemes:
  CocoDisplay:
    build:
      targets:
        CocoDisplay: all
