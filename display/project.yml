name: CocoDisplay
options:
  bundleIdPrefix: com.stormkiln
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CocoKit:
    path: CocoKit
  # Wake word (openWakeWord models, docs/wake-word.md). In the app target, not CocoKit, so
  # `swift test` never needs the ~50 MB binary. Static library, product "onnxruntime".
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  CocoDisplay:
    type: application
    platform: iOS
    sources:
      - App
      # openWakeWord models (committed): the two feature models, plus hey_coco.onnx once trained
      # (docs/wake-word.md). Without hey_coco.onnx the app runs with tap-to-talk only.
      - path: WakeWord
        buildPhase: resources
        optional: true
        excludes: ["README.md"]
    # Generated by XcodeGen (gitignored) and merged with GENERATE_INFOPLIST_FILE keys. Array and
    # dictionary keys can't be expressed as INFOPLIST_KEY_* build settings, so they live here.
    info:
      path: Info.plist
      properties:
        # XcodeGen's template hardcodes 1.0 / 1; keep the build settings authoritative.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_coco._tcp]
        # No NSAppTransportSecurity exception (#54): the Hub serves HTTPS/WSS (TLS 1.2+, ECDHE,
        # P-256/SHA-256 cert). Its certificate is self-signed, and CocoKit's
        # PinningSessionDelegate does the trust evaluation (exact match with the paired pin).
        # Only standard TLS (and hashing), so exempt from export compliance (#4).
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: CocoKit
      - package: OnnxRuntime
        product: onnxruntime
    # ONNX Runtime is a static library, linked into the app binary. Xcode's package handling
    # still embeds an empty stub onnxruntime.framework (binary minos 18.0, Info.plist 15.1)
    # that nothing loads, and App Store Connect rejects it as ITMS-90208. `embed: false` on the
    # dependency has no effect (Xcode adds the embed, not XcodeGen), so delete the stub before
    # signing.
    # The TestFlight workflow checks that the archive has no Frameworks/onnxruntime.framework.
    postBuildScripts:
      - name: Remove the onnxruntime.framework stub (ITMS-90208)
        basedOnDependencyAnalysis: false
        script: |
          rm -rf "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          rmdir "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}" 2>/dev/null || true
    # Bundle ID and signing (#4): defaults in Signing.xcconfig, team and overrides in the
    # gitignored Signing.local.xcconfig. Not set under `settings` below, which would win.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Coco
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "2"
        # Runs on Apple silicon Macs as "Designed for iPad" (#25); not Mac Catalyst.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Coco Display finds and talks to Coco Hub on your home network."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Coco listens for \u201chey coco\u201d, and to you when you tap the mic, so you can ask it things."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Coco turns what you say into text so it can answer you."
        # Apple Music fallback (#42). MusicKit also needs the MusicKit service on the App ID
        # (developer portal); see docs/apple-music.md.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Coco plays the music you ask for from Apple Music."
schemes:
  CocoDisplay:
    build:
      targets:
        CocoDisplay: all
