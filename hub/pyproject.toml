[project]
name = "coco-hub"
version = "0.1.0"
description = "Coco Hub: the Mac-side brain of hey-coco"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "icalendar>=7.3,<8",
    "ifaddr>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-kasa>=0.12",
    "recurring-ical-events>=3.8.2,<4",
    "segno>=1.6",
    "uvicorn[standard]>=0.32",
    "x-wr-timezone>=2.0.1,<3",
    "zeroconf>=0.136",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coco_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resilience checks run the real Hub as a subprocess and take ~a minute: `make hub-resilience`.
addopts = "-m 'not resilience'"
markers = ["resilience: runs the real Hub as a subprocess (slow; make hub-resilience)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-local-folder = ["backend_contract", "conftest", "fake_backend", "fake_kasa", "fake_ollama", "fake_spotify"]
