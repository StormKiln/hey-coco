# Curated sound library sources. One [[sound]] per clip.
#
#   id        stable slug; becomes clips/<id>.m4a and images/<id>.jpg
#   name      what Coco calls it ("This is what a <name> sounds like")
#   aliases   other things a child might say (matched case-insensitively, plural-tolerant)
#   category  "animal" | "vehicle"
#   audio     Commons file title of the recording
#   image     Commons file title of the picture
#   start/end optional trim in seconds; if start is omitted on a long recording, curate.py
#             picks the loudest 6 s window and records it in manifest.json (curation.start_used)
#
# Rebuild: uv run --with httpx python assets/sounds/tools/curate.py build

