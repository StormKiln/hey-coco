name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make hub-lint
      - run: make hub-test
      - run: make hub-resilience

  display:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Cache Swift packages (Porcupine is a large clone)
        uses: actions/cache@v4
        with:
          path: display/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('display/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - run: xcodebuild -version && swift --version
      - run: make kit-test
      - run: make display-build
