# Coco Hub settings. Copy to config.local.toml (gitignored) and fill in.
# Any value can be overridden by env: COCO_<FIELD>, nested with "__",
# e.g. COCO_TOKEN, COCO_PORT, COCO_NIGHT__START. COCO_CONFIG points at another file.

# Shared LAN token: the Display sends it as "Authorization: Bearer <token>".
# Generate one with: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
# Required, at least 24 characters. The Hub refuses to start without a real one.
token = ""

host = "0.0.0.0"
port = 8765
# data_dir = "~/Library/Application Support/CocoHub"
# sounds_dir = "~/CocoSounds"   # curated sound library; default is the repo's assets/sounds
# log_dir = "~/Library/Logs/CocoHub"   # hub.jsonl (rotated 5 MB x 5); `make hub-logs` follows it

timezone = "America/Toronto"
units = "metric"          # "metric" | "imperial"

# Home location: needed for weather (Open-Meteo, no key). Without lat/lon the idle screen
# shows no weather and weather questions say the location isn't set. A home location set from
# the iPad (Settings, Home location) overrides this until you choose "Use the Hub's default".
[location]
lat = 45.4215
lon = -75.6972
name = "Home"

[night]
start = "21:30"           # HH:MM, 24-hour, local time
end = "06:30"
dark_after_idle_s = 300

[qwen]
enabled = false           # needs Ollama running with the model pulled (ollama pull qwen3:8b)
model = "qwen3:8b"
base_url = "http://localhost:11434"
timeout_s = 6.0           # give up with "Sorry, that took too long." after this

[timers]
ring_cap_s = 600          # a ringing timer is auto-dismissed after this long
missed_grace_s = 3600     # timers that ended while the Hub was down ring if this recent

[diagnostics]
log_transcripts = true    # false: keep what Coco heard/said out of the log file (memory only)

[discovery]
enabled = true            # Bonjour _coco._tcp
name = "Coco Hub"

[tls]
# HTTPS/WSS with a self-signed certificate created in data_dir/tls on first run. The iPad pins
# it when you pair (compare `make hub-fingerprint`). Turn off only for local tests: the iPad
# won't pair with, or send its token to, a Hub without TLS.
enabled = true

[keys]
# youtube = ""            # YouTube Data API v3 key (Google Cloud console)

[youtube]
region = "CA"             # ISO country code for search results
daily_quota = 9000        # API units/day before Coco refuses searches (a search costs 100)

[spotify]
# Spotify Premium via the Spotify app on the iPad (Spotify Connect). See docs/spotify.md.
# Without client_id, Spotify stays off ("Spotify isn't set up yet.").
# client_id = ""                 # from developer.spotify.com (PKCE login: no secret needed)
# redirect_uri = "https://127.0.0.1:8765/spotify/callback"  # default; must match the app
# device_name = "iPad"           # Spotify Connect name of the iPad: always "iPad" (iPadOS hides
                                 # custom names from apps); ambiguous if 2 iPads share the account
# wake_wait_s = 4.0              # iPad missing: ask the Display to open Spotify, wait this
                                 # long (0 = off; does nothing under Guided Access, spike #5)

[music]
# Who plays "play Raffi": "spotify" (above) or "apple_music" (MusicKit on the iPad, #42).
# See docs/apple-music.md. Decide with the Spotify spike: docs/spikes/spotify-test-procedure.md.
# provider = "spotify"
