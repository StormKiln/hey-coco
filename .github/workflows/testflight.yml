# Archive Coco Display and upload it to TestFlight (#4). Manual only: Actions, TestFlight, Run
# workflow. Never runs on pull requests or pushes. See docs/testflight.md, "Uploading from GitHub".
#
# dry_run (the default) is a REHEARSAL: every check plus an UNSIGNED Release archive, kept as an
# artifact. It needs no secrets and uploads nothing, so run it first on any branch. Untick
# dry_run for the real upload, which must come from main's history and needs every secret below.
#
# Signing is automatic and cloud-managed: xcodebuild -allowProvisioningUpdates authenticates with
# the App Store Connect API key, creates or fetches the provisioning profile, and signs with Apple's
# cloud-managed distribution certificate. No certificate or profile is stored here. That needs an
# API key with the Admin role, or App Manager with "Access to Cloud Managed Distribution
# Certificate" ticked.
#
# Shared by every StormKiln app, so set on the org (Settings, Secrets and variables, Actions);
# a repository secret or variable of the same name overrides it:
#   ASC_KEY_ID, ASC_ISSUER_ID   secrets: App Store Connect API key ID and issuer ID
#   ASC_KEY_P8                  secret: the AuthKey_<KEY_ID>.p8 file, base64 (base64 -i AuthKey_X.p8 | pbcopy)
#   APPLE_TEAM_ID               variable: Apple team ID (not a secret; it is in every signed app)
# This repository only:
#   BUNDLE_ID                   variable, optional: if not com.stormkiln.heycoco.display
# The wake word needs no secret: its openWakeWord models are committed in display/WakeWord/.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearsal only (checks + unsigned archive, no secrets, no upload)
        type: boolean
        default: true

# One at a time, never cancelled: a later build number must not upload before an earlier one,
# and cancelling mid-upload leaves App Store Connect holding a half-seen build number.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: ${{ inputs.dry_run && 'Rehearsal (unsigned, no upload)' || 'Archive and upload' }}
    runs-on: xcode-27
    # Checks ~6 min + cold Release archive ~15 min + upload + 20 min processing wait. Generous
    # so only a hang trips it.
    timeout-minutes: 90
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      UV_LOCKED: "1"
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count, and the provenance check needs origin/main.
          fetch-depth: 0
          persist-credentials: false

      # Before anything slow: a real upload with a missing secret fails here, naming each one.
      - name: Preflight (secrets)
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -n "$DEVELOPMENT_TEAM" ] || missing="$missing APPLE_TEAM_ID(variable)"
          [ -s display/WakeWord/hey_coco.onnx ] || echo "::warning::display/WakeWord/hey_coco.onnx is not committed: the build ships without the wake word (docs/wake-word.md)"
          if [ -n "$missing" ]; then
            echo "::error::Missing org or repository secrets/variables:$missing. Add them (docs/testflight.md), or run with dry_run for a rehearsal."
            exit 1
          fi

      - name: Provenance (HEAD is on main's history)
        run: |
          echo "commit $(git rev-parse HEAD), ref $GITHUB_REF_NAME, build number $(git rev-list --count HEAD)"
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "HEAD is on origin/main."
          elif [ "$DRY_RUN" = true ]; then
            echo "::notice::HEAD is not on origin/main. Fine for a rehearsal; a real upload would stop here."
          else
            echo "::error::HEAD is not on origin/main's history. TestFlight builds come from main: merge first, then run from main."
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Select Xcode (XCODE_PRIMARY in the Makefile, same as CI's display-build)
        run: make ci-xcode
      - run: brew install xcodegen
      - name: Cache Swift packages (ONNX Runtime is a ~50 MB download)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: display/.spm
          key: spm-${{ runner.os }}-testflight-${{ hashFiles('display/project.yml', 'Makefile') }}
          restore-keys: spm-${{ runner.os }}-testflight-

      # Nothing gets signed until the same checks CI runs have passed on this exact commit.
      - run: make lint
      - run: make hub-test
      - run: make kit-test

      # ---- Rehearsal ----
      - name: Unsigned Release archive
        if: ${{ inputs.dry_run }}
        run: make display-archive-unsigned
      # The wake word's openWakeWord models are committed (no secrets): the feature models must
      # be in the app; without the trained hey_coco.onnx it ships with tap-to-talk only.
      - name: The archive bundles the wake-word models
        if: ${{ inputs.dry_run }}
        run: |
          app=display/build/CocoDisplay-unsigned.xcarchive/Products/Applications/CocoDisplay.app
          for f in melspectrogram.onnx embedding_model.onnx; do
            [ -s "$app/$f" ] || { echo "::error::$f is missing from the app bundle"; exit 1; }
          done
          [ -s "$app/hey_coco.onnx" ] || echo "::warning::No hey_coco.onnx in the app: it ships without the wake word (docs/wake-word.md)"
          # ITMS-90208 (build 39): Xcode embeds an empty onnxruntime.framework stub that
          # display/project.yml deletes; App Store Connect rejects the build if it ships.
          [ ! -e "$app/Frameworks/onnxruntime.framework" ] || { echo "::error::Frameworks/onnxruntime.framework is in the app (ITMS-90208); see display/project.yml"; exit 1; }
      - name: Package the unsigned archive
        if: ${{ inputs.dry_run }}
        run: make display-artifact ARCHIVE=build/CocoDisplay-unsigned.xcarchive
      - name: Keep the unsigned archive (zip + SHA256SUMS + commit.txt)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coco-display-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: display/build/artifact/
          if-no-files-found: error
          retention-days: 14

      # ---- Real upload ----
      - name: Write signing config and API key
        if: ${{ !inputs.dry_run }}
        env:
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          {
            echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM"
            echo "CODE_SIGN_STYLE = Automatic"
            if [ -n "$BUNDLE_ID" ]; then echo "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID"; fi
          } > display/Signing.local.xcconfig
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077 && echo "$ASC_KEY_P8" | base64 --decode > "$key")
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Check config
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make display-testflight-check
      # Read-only: refuses (before signing) a build number App Store Connect already has.
      - name: Build number is new to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make display-testflight-preflight
      - name: Signed Release archive
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make display-archive
      - name: The signed archive has no onnxruntime.framework stub (ITMS-90208)
        if: ${{ !inputs.dry_run }}
        run: |
          app=display/build/CocoDisplay.xcarchive/Products/Applications/CocoDisplay.app
          [ -d "$app" ] || { echo "::error::No CocoDisplay.app in the signed archive"; exit 1; }
          [ ! -e "$app/Frameworks/onnxruntime.framework" ] || { echo "::error::Frameworks/onnxruntime.framework is in the app (ITMS-90208); see display/project.yml"; exit 1; }
      - name: Package the signed archive
        if: ${{ !inputs.dry_run }}
        run: make display-artifact
      - name: Upload to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make display-testflight-upload

      # Provenance only: the repo is public and the signed archive is the distributable app, so
      # it goes to TestFlight only, never to the public artifacts. SHA256SUMS records the signed
      # archive's hash. Kept even if the upload or processing check fails.
      - name: Keep the provenance (SHA256SUMS + commit.txt, no archive)
        if: ${{ !cancelled() && !inputs.dry_run && hashFiles('display/build/artifact/SHA256SUMS') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coco-display-signed-provenance-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            display/build/artifact/SHA256SUMS
            display/build/artifact/commit.txt
          if-no-files-found: error
          retention-days: 14

      # Fails if Apple marks the build FAILED/INVALID. Still processing after 20 min is not a
      # failure: check later with the "TestFlight status" workflow.
      - name: Wait for Apple's processing (read-only)
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make testflight-status BUILD="$(git rev-list --count HEAD)" PENDING_EXIT=0

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
